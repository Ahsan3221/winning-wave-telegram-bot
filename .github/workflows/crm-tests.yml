name: Verify Winning Wave CRM
on:
  push:
    branches:
      - main
      - feature/winning-wave-crm-20261011
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Syntax checks
        run: python -m compileall -q bot.py crm_runtime.py crm.py database.py settings.py tests
      - name: Offline tests
        run: pytest -q
